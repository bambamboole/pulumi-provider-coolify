name: release

# Fired by the tag release-please creates when a release PR is merged:
#   vX.Y.Z
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Pulumi CLI
        run: |
          curl -fsSL https://get.pulumi.com | sh
          echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"
          "$HOME/.pulumi/bin/pulumi" version

      # Only install goreleaser here; the actual `goreleaser release` is run in
      # the "Release plugin binaries" step so we can pass PLUGIN_VERSION.
      - name: Install goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          install-only: true

      - name: Set release version
        id: version
        run: |
          # Strip the v prefix: v0.3.1 -> 0.3.1
          PLUGIN_VERSION="${GITHUB_REF_NAME#v}"
          echo "PLUGIN_VERSION=${PLUGIN_VERSION}" >> "$GITHUB_ENV"
          echo "version=${PLUGIN_VERSION}" >> "$GITHUB_OUTPUT"

      # Build with the real version so both the binary and the generated schema
      # report exactly what Pulumi expects for this release.
      - name: Build provider with release version
        run: go build -ldflags "-X main.version=${PLUGIN_VERSION}" -o bin/pulumi-resource-coolify ./cmd/pulumi-resource-coolify

      - name: Generate schema
        run: pulumi package get-schema ./bin/pulumi-resource-coolify > schema.json

      - name: Release plugin binaries
        # goreleaser attaches artifacts to the GitHub release created by
        # release-please (mode: keep-existing in .goreleaser.yml).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLUGIN_VERSION: ${{ env.PLUGIN_VERSION }}
        run: goreleaser release --clean

      - name: Publish SDK to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: sdk/nodejs
        run: |
          node -e "const fs=require('fs');const p='package.json';const j=JSON.parse(fs.readFileSync(p));j.version='${PLUGIN_VERSION}';if(j.pulumi)j.pulumi.version='${PLUGIN_VERSION}';fs.writeFileSync(p, JSON.stringify(j,null,2)+'\n')"
          npm ci
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
            npm publish --access public
          else
            npm run build
            npm pack --dry-run
          fi