name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Pulumi CLI
        run: |
          curl -fsSL https://get.pulumi.com | sh
          echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"
          pulumi version

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Verify provider schema generates
        run: |
          go build -o bin/pulumi-resource-coolify ./cmd/pulumi-resource-coolify
          pulumi package get-schema ./bin/pulumi-resource-coolify > schema.json
          test -s schema.json

  sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/nodejs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sdk/nodejs/package-lock.json
      - run: npm ci
      - run: npm run build