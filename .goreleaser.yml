# Builds the provider plugin binary for all supported platforms, generates the
# release artifacts (per-OS archives, SHA256SUMS, pulumi-plugin.json) and
# attaches the provider schema to the GitHub release.
#
# Release engineering flow:
#   1. release-please (release-please.yml) bumps versions, maintains CHANGELOG,
#      and on merge creates the version tag and a GitHub release.
#   2. This file runs on that tag and uploads the plugin binaries. Because the
#      GitHub release already exists (created by release-please), we use
#      mode: keep-existing so goreleaser attaches artifacts without clobbering
#      the changelog release notes.
version: 2

project_name: pulumi-provider-coolify

before:
  hooks:
    - go test ./...

builds:
  - id: provider
    main: ./cmd/pulumi-resource-coolify
    binary: pulumi-resource-coolify
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: provider-archive
    formats: [zip]
    name_template: "pulumi-resource-coolify-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    files:
      - pulumi-plugin.json

checksum:
  name_template: "SHA256SUMS.txt"

release:
  mode: keep-existing
  extra_files:
    - glob: ./schema.json